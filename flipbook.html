<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Flipbook Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .flipbook-container {
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 600px;
        }

        .book {
            position: relative;
            width: 800px;
            height: 600px;
            transform-style: preserve-3d;
        }

        .spread {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
        }

        .page {
            width: 50%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .page.left {
            box-shadow: 0 0 20px rgba(0,0,0,0.2), inset -3px 0 8px rgba(0,0,0,0.05);
        }

        .page.right {
            box-shadow: 0 0 20px rgba(0,0,0,0.2), inset 3px 0 8px rgba(0,0,0,0.05);
        }

        .page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.2), rgba(0,0,0,0.1));
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Simple fade transition */
        .spread {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            color: white;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 18px;
            font-weight: bold;
            min-width: 150px;
            text-align: center;
        }

        .loading {
            color: white;
            font-size: 24px;
            text-align: center;
        }

        .error {
            background: rgba(255, 255, 255, 0.9);
            color: #d32f2f;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- <h1>📖 PDF Flipbook Viewer</h1> -->
            <p id="status">Loading PDF...</p>
        </div>

        <div class="flipbook-container" id="flipbookContainer">
            <div class="loading" id="loading">Loading your PDF...</div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <button id="prevBtn" onclick="previousPage()">← Previous</button>
            <div class="page-info" id="pageInfo">Page 1 of 1</div>
            <button id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let renderedPages = {};

        // Get PDF URL from query string
        function getPDFUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const pdfUrl = urlParams.get('pdf') || urlParams.get('url');
            
            if (pdfUrl && window.location.protocol === 'file:') {
                return 'https://corsproxy.io/?' + encodeURIComponent(pdfUrl);
            }
            
            return pdfUrl;
        }

        // Initialize
        async function init() {
            const pdfUrl = getPDFUrl();
            
            if (!pdfUrl) {
                showError('No PDF URL provided. Please add ?pdf=YOUR_PDF_URL to the URL.');
                return;
            }

            try {
                document.getElementById('status').textContent = 'Loading PDF...';
                pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdfDoc.numPages;
                
                document.getElementById('status').textContent = `PDF loaded: ${totalPages} pages`;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
                
                await renderCurrentSpread();
            } catch (error) {
                showError('Failed to load PDF: ' + error.message);
            }
        }

        async function renderPage(pageNum, canvas) {
            if (!canvas) {
                console.error('Canvas is null for page', pageNum);
                return null;
            }

            if (renderedPages[pageNum]) {
                const cachedCanvas = renderedPages[pageNum];
                canvas.width = cachedCanvas.width;
                canvas.height = cachedCanvas.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(cachedCanvas, 0, 0);
                return canvas;
            }

            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            const ctx = canvas.getContext('2d');
            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;

            const cacheCanvas = document.createElement('canvas');
            cacheCanvas.width = canvas.width;
            cacheCanvas.height = canvas.height;
            const cacheCtx = cacheCanvas.getContext('2d');
            cacheCtx.drawImage(canvas, 0, 0);
            renderedPages[pageNum] = cacheCanvas;
            
            return canvas;
        }

        async function renderCurrentSpread() {
            const container = document.getElementById('flipbookContainer');
            container.innerHTML = '';

            console.log('Rendering spread - currentPage:', currentPage, 'totalPages:', totalPages);

            const book = document.createElement('div');
            book.className = 'book';

            const spread = document.createElement('div');
            spread.className = 'spread';

            // Left page
            const leftPage = document.createElement('div');
            leftPage.className = 'page left';
            spread.appendChild(leftPage);

            if (currentPage <= totalPages) {
                const leftCanvas = document.createElement('canvas');
                leftPage.appendChild(leftCanvas);
                console.log('Rendering left page:', currentPage);
                await renderPage(currentPage, leftCanvas);
            }

            // Right page
            const rightPage = document.createElement('div');
            rightPage.className = 'page right';
            spread.appendChild(rightPage);
            
            if (currentPage + 1 <= totalPages) {
                const rightCanvas = document.createElement('canvas');
                rightPage.appendChild(rightCanvas);
                console.log('Rendering right page:', currentPage + 1);
                await renderPage(currentPage + 1, rightCanvas);
            }

            // Spine
            const spine = document.createElement('div');
            spine.className = 'spine';
            spread.appendChild(spine);

            book.appendChild(spread);
            container.appendChild(book);
            updateControls();
        }

        function updateControls() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (totalPages === 1) {
                pageInfo.textContent = `Page 1 of 1`;
            } else {
                const endPage = Math.min(currentPage + 1, totalPages);
                pageInfo.textContent = `Pages ${currentPage}-${endPage} of ${totalPages}`;
            }

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        async function nextPage() {
            if (currentPage + 1 < totalPages) {
                currentPage += 2;
            } else if (currentPage < totalPages) {
                currentPage = totalPages;
            }
            await renderCurrentSpread();
        }

        async function previousPage() {
            if (currentPage > 2) {
                currentPage -= 2;
            } else {
                currentPage = 1;
            }
            await renderCurrentSpread();
        }

        function showError(message) {
            const container = document.getElementById('flipbookContainer');
            container.innerHTML = `<div class="error"><h2>Error</h2><p>${message}</p></div>`;
            document.getElementById('status').textContent = 'Error loading PDF';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                previousPage();
            }
        });

        // Start the app
        init();
    </script>
</body>
</html>
